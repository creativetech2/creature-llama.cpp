version = 1

; Settings for the models served by start-master.ps1.
; A model file in the models folder is listed as its file name without .gguf.
; Add a [section] named like the model to give it its own settings. Then press
; "Rescan folder" in the Models tab (or run add-model.ps1) to apply changes.

; shared by all models
[*]
c = 65536
n-gpu-layers = 99
jinja = true

; example: settings for one model (the section name is the model id)
; [Qwen3-Coder-30B-A3B-Instruct-Q4_K_M]
; c = 131072
; ; name Claude Code can ask for, mapped to this model
; alias = claude-sonnet-4-5
; ; share per device, order: master GPU first, then the RPC devices
; tensor-split = 10,7,2,2,2
; ; small model for speculative decoding
; model-draft = C:/Users/BEAST-II/llama-models/Qwen3-0.6B-Q8_0.gguf
